name: medicohub
description: Compliance-first doctor-patient education and forum MVP.
publish_to: "none"
version: 1.3.25+33

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.1
  path_provider: ^2.1.3
  permission_handler: ^11.3.1
  record: ^6.0.0
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  google_sign_in: ^6.3.0
  cloud_firestore: ^6.3.0
  file_picker: ^10.3.2
  http_parser: ^4.1.2
  audioplayers: ^6.5.0
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.3
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.4
  google_mobile_ads: ^6.0.0
  package_info_plus: ^8.3.1
  flutter_colorpicker: ^1.1.0
  youtube_player_iframe: ^6.0.0
  share_plus: ^12.0.2
  flutter_quill: ^11.5.0
  flutter_quill_delta_from_html: ^1.5.3
  vsc_quill_delta_to_html: ^1.0.5
  flutter_widget_from_html: ^0.17.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  firebase_core_platform_interface: ^6.0.3

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
