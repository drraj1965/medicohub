services:
  - name: medicohub-backend
    type: web
    runtime: python
    plan: free
    rootDir: backend_fastapi
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: ENABLE_FIRESTORE
        value: "true"
      - key: ENABLE_FIREBASE_STORAGE
        value: "true"
      - key: ENABLE_GOOGLE_DRIVE
        value: "false"
      - key: FIREBASE_PROJECT_ID
        value: mediconverse
      - key: FIREBASE_STORAGE_BUCKET
        value: mediconverse.firebasestorage.app
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        value: /etc/secrets/medicohub-firebase-admin.json
      - key: OTP_CODE_TTL_MINUTES
        value: "10"
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_SENDER_EMAIL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_SENDER_EMAIL
        sync: false
      - key: ENABLE_SMTP_TLS
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_PHONE
        sync: false
      - key: TWILIO_WHATSAPP_NUMBER
        sync: false
