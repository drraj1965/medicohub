app = "medicohub-backend"
primary_region = "bom"

[build]

[env]
  APP_ENV = "production"
  ENABLE_FIRESTORE = "true"
  ENABLE_FIREBASE_STORAGE = "true"
  ENABLE_GOOGLE_DRIVE = "false"
  FIREBASE_PROJECT_ID = "mediconverse"
  FIREBASE_STORAGE_BUCKET = "mediconverse.firebasestorage.app"
  OTP_CODE_TTL_MINUTES = "10"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
